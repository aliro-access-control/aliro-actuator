[tool.poetry]
name = "aliro-actuator"
version = "0.1.1"
description = "Aliro actuator to be used with the aliro test framework"
license = "Apache-2.0"
authors = ["Mike Jongen <mike.jongen@nxp.com>"]
readme = "README.md"
packages = [
  { include = "aliro_actuator", from = "src" }
]

[tool.poetry.dependencies]
python = "^3.9"
loguru = "^0.7"
cryptography = "^41.0.3"
pycryptodome = "^3.18.0"
asn1 = "^2.7.0"
pyopenssl = "^23.2.0"
pyserial = "^3.5"
ber-tlv = "^0.0.6"

[tool.poetry.dev-dependencies]
sphinx = "^7.2.5"
faker = "^18.7.0"
black = "^23.3.0"
isort = "^5.12.0"
autoflake = "^2.1.1"
flake8 = "^6.0.0"
mypy = "^1.3.0"
pytest-cov = "^4.0.0"
pytest = "^7.3.1"

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 88

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["src"]
